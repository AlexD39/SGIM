name: CI

on:
  push:
    branches: [main, feature/dom]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: test_secret
      JWT_EXPIRES_IN: 1h
      SESSION_SECRET: test_session
      SESSION_EXPIRES_IN: 24h
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: test_db
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_USER: test@example.com
      SMTP_PASS: testpass
      SMTP_FROM: SGIM

  frontend-ci:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: hashFiles('frontend/package.json') != ''
        run: npm install
        working-directory: frontend

      - name: Build
        if: hashFiles('frontend/package.json') != ''
        run: npm run build --if-present
        working-directory: frontend