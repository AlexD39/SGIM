name: CI

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: test_secret
      JWT_EXPIRES_IN: 1h
      SESSION_SECRET: test_session
      SESSION_EXPIRES_IN: 24h
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: test_db
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_USER: test@example.com
      SMTP_PASS: testpass
      SMTP_FROM: SGIM

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (safe mode)
        run: |
          npm install || true

      - name: Run tests safely
        run: |
          if [ -f package.json ] && grep -q '"test"' package.json; then
            npm test || echo "Tests failed but continuing"
          else
            echo "No tests found"
          fi

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (safe mode)
        if: hashFiles('frontend/package.json') != ''
        run: |
          npm install || true
        working-directory: frontend

      - name: Build
        if: hashFiles('frontend/package.json') != ''
        run: npm run build --if-present
        working-directory: frontend